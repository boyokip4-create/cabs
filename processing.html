<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CABS - Processing Application</title>
    <style>
        :root { --cabs-blue: #0d1a70; --cabs-green: #67ad38; --bg-color: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--bg-color); }
        .container { width: 100%; max-width: 400px; text-align: center; padding: 20px; }
        .logo { width: 150px; margin-bottom: 30px; }
        .progress-bar { width: 100%; height: 20px; background: #eee; border-radius: 10px; overflow: hidden; margin: 20px 0; }
        .progress-fill { height: 100%; width: 0%; background: var(--cabs-blue); transition: width 0.5s; }
        #status-text { font-weight: 600; color: var(--cabs-blue); font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="CABS Logo" class="logo">
        <div id="status-text">Processing...</div>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
    </div>

    <script>
        const statusEl = document.getElementById('status-text');
        const fillEl = document.getElementById('progress-fill');
        const steps = [
            { text: "Processing Data...", width: "33%" },
            { text: "Reviewing Eligibility...", width: "66%" },
            { text: "Finalizing Application...", width: "100%" }
        ];

        let currentStep = 0;
        const interval = setInterval(() => {
            if (currentStep < steps.length) {
                statusEl.innerText = steps[currentStep].text;
                fillEl.style.width = steps[currentStep].width;
                currentStep++;
            } else {
                clearInterval(interval);
                window.location.href = 'review.html';
            }
        }, 5000);
    </script>
</body>
</html>
