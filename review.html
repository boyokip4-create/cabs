<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CABS - Application Review</title>
    <style>
        :root { --cabs-blue: #0d1a70; --cabs-green: #67ad38; --bg-color: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--bg-color); }
        .container { width: 100%; max-width: 400px; text-align: center; padding: 20px; }
        .logo { width: 150px; margin-bottom: 30px; }
        h1 { color: var(--cabs-blue); margin-bottom: 10px; }
        p { color: #555; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="CABS Logo" class="logo">
        <h1>Under Review</h1>
        <p>Your loan application is currently under review. You will be notified via SMS or Email once a decision has been reached.</p>
    </div>
</body>
</html>
